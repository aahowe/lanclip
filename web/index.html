<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
  <title>LanClip</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6m4-6v6M6.5 7l.8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="m20 11.5-7.8 7.8a5 5 0 0 1-7.1-7.1l8.2-8.2a3.4 3.4 0 0 1 4.8 4.8l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13m0 0-5.5-5.5M18 12l-5.5 5.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11m0-11-11 11"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-10m-5-5 5 5m-5-5v5h5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v2.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V15"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <header class="top">
      <div class="brand">
        <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
        <div>
          <h1>LanClip</h1>
          <p data-i18n="tagline">局域网剪贴板</p>
        </div>
      </div>
      <div class="presence" id="presence" data-state="connecting">
        <span class="dot"></span><span class="presence-text" data-i18n="connecting">连接中…</span>
      </div>
    </header>

    <section class="composer" id="composer">
      <textarea id="input" rows="3" placeholder="输入或粘贴文字，也可以直接粘贴截图、拖入文件…" data-i18n-ph="placeholder" spellcheck="false"></textarea>
      <div class="composer-bar">
        <label class="btn btn-ghost" title="选择文件" data-i18n-title="pickFiles">
          <svg class="ic"><use href="#i-clip"/></svg><span data-i18n="addFile">添加文件</span>
          <input type="file" id="picker" multiple hidden>
        </label>
        <span class="hint" id="hint"><kbd id="mod">⌘</kbd><kbd>Enter</kbd> <span data-i18n="toSend">发送</span></span>
        <button class="btn btn-primary" id="send" disabled>
          <span data-i18n="send">发送</span><svg class="ic"><use href="#i-send"/></svg>
        </button>
      </div>
    </section>

    <div class="uploads" id="uploads"></div>

    <div class="list-head" id="list-head" hidden>
      <h2><span data-i18n="recent">最近内容</span> <span class="count" id="count"></span></h2>
      <button class="btn btn-quiet" id="clear" data-i18n="clearAll">清空全部</button>
    </div>

    <ul class="feed" id="feed"></ul>

    <div class="empty" id="empty" hidden>
      <div class="empty-art" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <h3 data-i18n="emptyTitle">这里还空着</h3>
      <p data-i18n-html="emptyBody">在任意设备上打开这个页面，<br>发送的文字、图片和文件会同步出现在所有设备上。</p>
    </div>

    <footer class="foot" id="foot"></footer>
  </div>

  <div class="dropzone" id="dropzone" aria-hidden="true">
    <div class="dropzone-inner">
      <svg class="ic"><use href="#i-upload"/></svg>
      <strong data-i18n="dropTitle">松开即可上传</strong>
      <span data-i18n="dropSub">支持任意类型、多个文件</span>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img alt="">
    <button class="icon-btn lightbox-close" aria-label="关闭" data-i18n-title="close"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
